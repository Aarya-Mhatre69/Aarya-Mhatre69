<svg viewBox="0 0 460 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="dotgrid2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#173252" />
    </pattern>
  </defs>

  <rect width="460" height="560" rx="14" fill="#0B1420"/>
  <rect width="460" height="560" rx="14" fill="url(#dotgrid2)"/>
  <rect width="460" height="560" rx="14" fill="none" stroke="#1E3A5C" stroke-width="1.5"/>

  <!-- header -->
  <text x="26" y="38" font-family="SFMono-Regular, Consolas, monospace" font-size="12" letter-spacing="3" fill="#7C93AC">OPERATOR</text>
  <text x="410" y="38" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="12" fill="#4C6079">U1</text>
  <line x1="26" y1="50" x2="434" y2="50" stroke="#1E3A5C" stroke-width="1"/>

  <!-- abstract low-poly bust illustration -->
  <g transform="translate(230,168)">
    <circle cx="0" cy="0" r="118" fill="none" stroke="#1E3A5C" stroke-width="1"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#16283D" stroke-width="1"/>

    <!-- shoulders -->
    <path d="M -95 118 Q 0 40 95 118 L 95 150 L -95 150 Z" fill="#101E2E" stroke="#2C4C70" stroke-width="1.5"/>

    <!-- low-poly head, faceted line art -->
    <polygon points="0,-92 46,-64 54,-6 34,48 0,66 -34,48 -54,-6 -46,-64"
      fill="#101E2E" stroke="#5ED0EA" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- facet lines -->
    <line x1="0" y1="-92" x2="0" y2="66" stroke="#2C4C70" stroke-width="1"/>
    <line x1="-46" y1="-64" x2="0" y2="-20" stroke="#2C4C70" stroke-width="1"/>
    <line x1="46" y1="-64" x2="0" y2="-20" stroke="#2C4C70" stroke-width="1"/>
    <line x1="-54" y1="-6" x2="0" y2="10" stroke="#2C4C70" stroke-width="1"/>
    <line x1="54" y1="-6" x2="0" y2="10" stroke="#2C4C70" stroke-width="1"/>
    <line x1="-34" y1="48" x2="0" y2="10" stroke="#2C4C70" stroke-width="1"/>
    <line x1="34" y1="48" x2="0" y2="10" stroke="#2C4C70" stroke-width="1"/>

    <!-- vias marking facet joints -->
    <circle cx="0" cy="-92" r="2.4" fill="#F2A65A"/>
    <circle cx="0" cy="-20" r="2.4" fill="#F2A65A"/>
    <circle cx="0" cy="10" r="2.4" fill="#F2A65A"/>
    <circle cx="0" cy="66" r="2.4" fill="#F2A65A"/>
  </g>

  <text x="230" y="330" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#4C6079">fig. 01 &#8212; stylized, not a photograph</text>

  <line x1="26" y1="350" x2="434" y2="350" stroke="#1E3A5C" stroke-width="1"/>

  <!-- spec rows -->
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="13.5">
    <text x="26" y="380" fill="#5ED0EA">BASE</text>
    <text x="150" y="380" fill="#C9D8E5">Uran, Maharashtra, IN</text>

    <rect x="26" y="392" width="408" height="30" fill="#0F1D2C"/>
    <text x="26" y="412" fill="#5ED0EA">ROLE</text>
    <text x="150" y="412" fill="#C9D8E5">SWE Intern @ InfinityPool Finnotech</text>

    <text x="26" y="444" fill="#5ED0EA">FOCUS</text>
    <text x="150" y="444" fill="#C9D8E5">Backend &#183; Agentic AI &#183; RAG &#183; Full-Stack</text>

    <rect x="26" y="456" width="408" height="30" fill="#0F1D2C"/>
    <text x="26" y="476" fill="#5ED0EA">EDU</text>
    <text x="150" y="476" fill="#C9D8E5">B.Tech CE, AI/ML Hons &#8212; FCRIT</text>

    <text x="26" y="508" fill="#5ED0EA">OPEN TO</text>
    <text x="150" y="508" fill="#C9D8E5">SWE &amp; AI engineering internships</text>
  </g>

  <line x1="26" y1="524" x2="434" y2="524" stroke="#1E3A5C" stroke-width="1"/>
  <text x="230" y="546" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="11" letter-spacing="1" fill="#4C6079">CGPA 9.14/10 &#183; FR. C. RODRIGUES INSTITUTE OF TECHNOLOGY</text>
